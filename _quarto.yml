project:
  type: website
  output-dir: _site
  preview:
    port: 5899
    browser: true
  render:
    - "*.qmd"
    - "!fragments/"
    - "!class/1-git-github-pages/"
    - "!class/2-how-llms-work/"
    - "!class/3-agents/"
    - "!class/4-context-engineering/"
    - "!class/5-planning-and-memory/"
    - "!class/6-skills/"
    - "!class/7-verification/"
    - "!class/8-continuous-integration/"
    - "!class/9-data-analysis/"
    - "!class/10-llm-apis/"
    - "!class/11-mcp/"
    - "!class/12-multi-agent/"
  resources:
    - "class/"
    - "hw/"
    - "project/"

website:
  title: EMSE 4197
  site-url: https://jhelvy.github.io/intro-to-agentic-engineering/
  repo-url: https://github.com/jhelvy/intro-to-agentic-engineering
  repo-actions: [edit, issue]
  description: 'Course website for the Fall 2027 semester of the EMSE course "Build with AI: An Introduction to Agentic Engineering" at GWU'
  search: true
  sidebar:
    style: "docked"
    background: "dark"
    collapse-level: 1
    search: true
    contents:
      - text: Home
        icon: house-door-fill
        href: index.qmd
      - text: Syllabus
        icon: map-fill
        href: syllabus.qmd
      - text: Schedule
        icon: table
        href: schedule.qmd
      - section: Builds (Individual)
        icon: hammer
        contents:
          - text: "1: Git Warm-Up"
            href: hw/1-git-warmup.qmd
          - text: "2: Probe the Model"
            href: hw/2-probe-the-model.qmd
          - text: "3: Personal Website"
            href: hw/3-personal-website.qmd
          - text: "4: Ingestion (Review or Novel)"
            href: hw/4-ingestion.qmd
          - text: "5: Recreate an App"
            href: hw/5-recreate-app.qmd
          - text: "6: Video Game"
            href: hw/6-video-game.qmd
          - text: "7: Review Harness"
            href: hw/7-review-harness.qmd
          - text: "8: Cloud Robot"
            href: hw/8-cloud-robot.qmd
          - text: "9: Agentic Data Analysis"
            href: hw/9-data-analysis.qmd
          - text: "10: AI-Powered Tool"
            href: hw/10-ai-tool.qmd
          - text: "11: MCP Server"
            href: hw/11-mcp-server.qmd
      - section: Team Project
        icon: people-fill
        contents:
          - text: Overview
            href: project/0-overview.qmd
          - text: Proposal
            href: project/1-proposal.qmd
          - text: Interim Report
            href: project/2-interim-report.qmd
          - text: Final Report
            href: project/3-final-report.qmd
          - text: Final Presentation
            href: project/4-presentation.qmd
      - text: Software & Setup
        icon: download
        href: software.qmd
      - text: FAQ
        icon: question-square-fill
        href: faq.qmd
      - text: Resources
        icon: bookmark-fill
        href: references.qmd
      - section: Other
        icon: question-circle-fill
        contents:
          - text: About
            icon: question-circle-fill
            href: about.qmd
          - text: License
            icon: award-fill
            href: LICENSE.qmd
          - text: Contact
            icon: envelope-fill
            href: mailto:jph@gwu.edu
          - text: Source files
            icon: github
            href: https://github.com/jhelvy/intro-to-agentic-engineering
  page-footer:
    center:
      - text: "© 2027 John Paul Helveston {{< fa creative-commons-sa >}} <a href='LICENSE.html'><i class='fab fa-creative-commons'></i><i class='fab fa-creative-commons-by'></i><i class='fab fa-creative-commons-sa'></i></a><br><i class='far fa-calendar-alt'></i> {{< var weekday >}} | <i class='far fa-clock'></i> {{< var time >}} | <i class='fa fa-map-marker-alt'></i> {{< var room >}}<br><a href='https://www.jhelvy.com'><i class='fas fa-user'></i> Dr. John Paul Helveston</a> | <a href='mailto:{{< var email >}}'><i class='fas fa-envelope'></i> {{< var email >}}</a> | <a href='{{< var repo >}}'><i class='fab fa-github'></i></a>"

format:
  html:
    theme: minty
    css: styles.css
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: false

filters:
    - schedule.lua
